<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bleach Traitdle</title><link rel="stylesheet" href="../one-piece/file.css"><link rel="stylesheet" href="bleach.css"><script src="bleach-data.js"></script><script src="../one-piece/daily-utils.js"></script></head>
<body><main class="game bleach-game">
<header><a class="home-link" href="../index.html">All worlds</a><img class="masthead-art" src="https://tse1.mm.bing.net/th?q=Bleach+anime+banner" alt="Bleach Traitdle banner"><div class="masthead-shade"></div><div class="masthead-content"><div class="eyebrow">TRAITDLE / BLEACH / SOUL SOCIETY</div><h1>SOUL DLE</h1><p class="subtitle">Read the zanpakuto. Find the Soul Reaper.</p><div class="mode-switch" role="group" aria-label="Clue mode"><button id="characterMode" class="mode-button active" type="button" aria-pressed="true">Characters</button><button id="imageMode" class="mode-button" type="button" aria-pressed="false">Blurry images</button></div><div class="mode-switch" role="group" aria-label="Game mode"><button id="dailyMode" class="mode-button active" type="button" aria-pressed="true">Daily</button><button id="freeplayMode" class="mode-button" type="button" aria-pressed="false">Freeplay</button></div><p id="modeNote" class="mode-note">Daily character target</p></div></header>
<section class="world-clue"><p>Character clue</p><h2 id="clueTitle">Find the character from the traits below</h2><img id="imageClue" alt="Blurred mystery character" hidden></section>
<div class="toolbar"><div class="controls"><div class="guess-count" aria-live="polite">Guesses <b id="guessCount">0</b></div><div class="autocomplete"><input id="guessInput" type="text" placeholder="Type any Bleach character..." aria-label="Guess a character" autocomplete="off" aria-autocomplete="list" aria-controls="suggestions"><div id="suggestions" class="suggestions" role="listbox" hidden></div></div><button id="guessBtn" type="button">Guess</button><button id="giveUp" type="button" class="secondary" disabled>Give up</button><button id="newGame" type="button" class="secondary" hidden>New game</button></div><p id="message" class="hint-message" role="status" aria-live="polite"></p></div>
<section id="successPanel" class="success-panel" aria-live="polite" aria-labelledby="successTitle" tabindex="-1" hidden><div class="success-art-wrap"><img id="successImage" class="success-art" alt=""></div><div class="success-copy"><p class="success-kicker">ANSWER REVEALED</p><h2 id="successTitle">Character found</h2><p id="successDetails" class="success-details"></p><p id="successGuessCount" class="success-guess-count"></p><button id="successContinue" type="button">Keep playing</button><div id="dailyScore" class="daily-score" hidden><p>Both daily modes complete</p><pre id="dailyScoreText"></pre><button id="copyDailyScore" type="button">Copy results</button></div></div></section>
<div id="board" aria-label="Character trait board"></div><div class="legend" aria-label="Legend"><span><i class="dot correct"></i>Exact</span><span><i class="dot absent"></i>Missing</span></div>
</main><script>
const data=bleachCharacters;
const categories=[['name','Character'],['gender','Gender'],['age','Age'],['hairColor','Hair colour'],['zanpakuto','Zanpakuto'],['species','Species'],['origin','Birthplace'],['faction','Faction'],['arc','First arc']].map(([key,label])=>({key,label})),arcOrder={'Agent of the Shinigami':1,'Soul Society':2,'Arrancar: The Arrival':3,'Thousand-Year Blood War':4,'Backstory':0};
const stateKey='bleach-traitdle-daily';
let mode='character', gameMode='daily', target=null, guesses=[], over=false, suggestionIndex=-1, rounds={};
const $=id=>document.getElementById(id), board=$('board'), input=$('guessInput'), suggestions=$('suggestions'), count=$('guessCount'), message=$('message'), guessBtn=$('guessBtn'), giveUp=$('giveUp'), newGame=$('newGame'), successPanel=$('successPanel');
function norm(value){return String(value??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function hash(value){let n=2166136261;for(const c of value){n^=c.charCodeAt(0);n=Math.imul(n,16777619)}return Math.abs(n)}
function status(guess,answer,key){if(String(guess[key]??'Unknown').toLowerCase()===String(answer[key]??'Unknown').toLowerCase())return'correct';if(key==='age'&&Number(guess.age)&&Number(answer.age))return Number(guess.age)<Number(answer.age)?'higher':'lower';if(key==='arc'&&arcOrder[guess.arc]!==undefined&&arcOrder[answer.arc]!==undefined)return arcOrder[guess.arc]<arcOrder[answer.arc]?'higher':'lower';return'absent'}
function shown(guess,answer,key){if(status(guess,answer,key)==='correct')return guess[key]??'Unknown';if(key==='age'&&Number(guess.age)&&Number(answer.age))return String(guess.age)+(Number(guess.age)<Number(answer.age)?' \u2191':' \u2193');if(key==='arc'&&arcOrder[guess.arc]!==undefined&&arcOrder[answer.arc]!==undefined)return String(guess.arc)+(arcOrder[guess.arc]<arcOrder[answer.arc]?' \u2191':' \u2193');return guess[key]??'Unknown'}
function targetForMode(){return gameMode==='daily'?data[hash(stateKey+'-'+getMstDateKey()+'-'+mode)%data.length]:data[Math.floor(Math.random()*data.length)]}
function renderSuggestions(value){suggestions.innerHTML='';suggestionIndex=-1;const query=norm(value);if(!query){suggestions.hidden=true;return}data.filter(c=>!guesses.includes(c.name)&&norm(c.name).includes(query)).slice(0,30).forEach((c,index)=>{const button=document.createElement('button');button.type='button';button.className='suggestion';button.setAttribute('role','option');button.id='suggestion-'+index;const image=document.createElement('img');image.src=c.image;image.alt='';image.loading='lazy';const name=document.createElement('span');name.textContent=c.name;button.append(image,name);button.onclick=()=>selectSuggestion(index);suggestions.append(button)});suggestions.hidden=!suggestions.children.length}
function selectSuggestion(index){const option=suggestions.children[index];if(!option)return;input.value=option.querySelector('span').textContent;suggestions.hidden=true;suggestionIndex=-1;input.focus()}
function renderGuess(character){const row=document.createElement('div');row.className='row';categories.forEach(({key,label},index)=>{const tile=document.createElement('div');tile.className='tile '+status(character,target,key)+' reveal';tile.style.setProperty('--flip-delay',index*70+'ms');tile.innerHTML='<span class="trait-label">'+label+'</span><span class="trait-value">'+shown(character,target,key)+'</span>';row.append(tile)});board.prepend(row)}
function renderImageGuess(character,correct){const row=document.createElement('div');row.className='row';row.innerHTML='<div class="tile '+(correct?'correct':'absent')+' reveal"><span class="trait-label">Character</span><span class="trait-value">'+character.name+'</span></div>';board.prepend(row)}
function roundKey(){return gameMode+'-'+mode} function save(result=null){rounds[roundKey()]={targetName:target?.name,guesses:[...guesses],over};if(gameMode==='daily')saveDailyGameState(stateKey,mode,guesses,over,result||null)}
function showSuccess(won){over=true;save(won?'solved':'gave-up');guessBtn.disabled=true;giveUp.disabled=true;newGame.hidden=gameMode==='daily';const dailyScore=$('dailyScore');if(gameMode==='daily'){const states=['character','image'].map(clueMode=>readDailyGameState(stateKey,clueMode));const complete=states.every(state=>state.over);dailyScore.hidden=!complete;if(complete){const scoreValue=state=>state.result==='gave-up'?'-':state.guesses.length;const scoreText=appendShareLink("I've completed both Bleach Traitdle modes today:\n🗡️ Characters: "+scoreValue(states[0])+"\n🌫️ Blurry images: "+scoreValue(states[1]),traitdleShareUrl+'bleach/bleach.html');$('dailyScoreText').textContent=scoreText;enableCopyButton($('copyDailyScore'),scoreText)}}else{dailyScore.hidden=true}successPanel.hidden=false;$('successImage').src=target.image;$('successImage').alt=target.name;$('successTitle').textContent=won?'Correct: '+target.name:target.name;$('successDetails').textContent=won?'A Bleach mystery solved.':'The answer was revealed.';$('successGuessCount').textContent=won?'Solved in '+guesses.length+' '+(guesses.length===1?'guess.':'guesses.'):'The answer was revealed.';document.querySelector('.game').classList.add('success-state');successPanel.focus({preventScroll:true});successPanel.scrollIntoView({behavior:'smooth',block:'center'})}
function restore(){const saved=gameMode==='daily'?readDailyGameState(stateKey,mode):rounds[roundKey()]||{guesses:[],over:false};if(!saved.over&&!saved.guesses?.length)return false;if(saved.targetName){const savedTarget=data.find(c=>c.name===saved.targetName);if(savedTarget)target=savedTarget}guesses=saved.guesses||[];guesses.forEach(name=>{const character=data.find(c=>c.name===name);if(character)mode==='character'?renderGuess(character):renderImageGuess(character,character.name===target.name)});count.textContent=guesses.length;showSuccess(guesses.includes(target.name));return true}
function start(){if(target&&!over)save();board.innerHTML='';successPanel.hidden=true;document.querySelector('.game').classList.remove('success-state');guesses=[];over=false;count.textContent='0';message.textContent='';input.value='';input.disabled=false;guessBtn.disabled=false;giveUp.disabled=false;newGame.hidden=true;const savedRound=rounds[roundKey()];target=savedRound?.targetName?data.find(c=>c.name===savedRound.targetName)||targetForMode():targetForMode();$('modeNote').textContent=(gameMode==='daily'?'Daily':'Freeplay')+' '+(mode==='character'?'character':'image')+' target';$('imageClue').hidden=mode!=='image';$('clueTitle').hidden=mode==='image';if(mode==='image')$('imageClue').src=target.image;restore()}
function submit(){if(over)return;const character=data.find(c=>norm(c.name)===norm(input.value));if(!character){message.textContent='Choose a character from the suggestions.';return}if(guesses.includes(character.name)){message.textContent='You already guessed that character.';return}guesses.push(character.name);count.textContent=guesses.length;mode==='character'?renderGuess(character):renderImageGuess(character,character.name===target.name);input.value='';suggestions.hidden=true;message.textContent='';save();if(character.name===target.name)showSuccess(true)}
function setMode(next){mode=next;characterMode.classList.toggle('active',next==='character');imageMode.classList.toggle('active',next==='image');characterMode.setAttribute('aria-pressed',String(next==='character'));imageMode.setAttribute('aria-pressed',String(next==='image'));start()}
characterMode.onclick=()=>setMode('character');imageMode.onclick=()=>setMode('image');
function setGameMode(next){gameMode=next;dailyMode.classList.toggle('active',next==='daily');freeplayMode.classList.toggle('active',next==='freeplay');dailyMode.setAttribute('aria-pressed',String(next==='daily'));freeplayMode.setAttribute('aria-pressed',String(next==='freeplay'));start()}
dailyMode.onclick=()=>setGameMode('daily');freeplayMode.onclick=()=>setGameMode('freeplay');guessBtn.onclick=submit;giveUp.onclick=()=>showSuccess(false);newGame.onclick=start;successContinue.onclick=()=>setMode(mode==='character'?'image':'character');$('copyDailyScore').onclick=()=>{};input.oninput=()=>renderSuggestions(input.value);input.onfocus=()=>renderSuggestions(input.value);input.onkeydown=event=>{if((event.key==='ArrowDown'||event.key==='ArrowUp')&&!suggestions.hidden){event.preventDefault();const total=suggestions.children.length;suggestionIndex=event.key==='ArrowDown'?(suggestionIndex+1)%total:(suggestionIndex-1+total)%total;[...suggestions.children].forEach((item,index)=>item.classList.toggle('active',index===suggestionIndex));return}if(event.key==='Escape'){suggestions.hidden=true;return}if(event.key==='Enter'){event.preventDefault();if(!suggestions.hidden){selectSuggestion(suggestionIndex>=0?suggestionIndex:0)}else submit()}};document.addEventListener('click',event=>{if(!event.target.closest('.autocomplete'))suggestions.hidden=true});start();
</script></body></html>
