<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jujutsu Kaisen Traitdle</title>
  <link rel="stylesheet" href="../one-piece/file.css">
  <link rel="stylesheet" href="jjk.css">
  <script src="jjk-data.js"></script>
  <script src="jjk-culling-data.js"></script>
  <script src="../one-piece/daily-utils.js"></script>
</head>
<body>
  <main class="game">
    <header>
      <a class="home-link" href="../index.html">All worlds</a>
      <img class="masthead-art" src="assets/jjk-background.jpg" alt="Jujutsu Kaisen background" fetchpriority="high">
      <div class="masthead-shade"></div>
      <div class="masthead-content">
        <div class="eyebrow">TRAITDLE / JUJUTSU KAISEN</div>
        <h1>CURSE DLE</h1>
        <p class="subtitle">Read the cursed energy. Find the character.</p>
        <div class="mode-switch mode-selector" role="group" aria-label="Jujutsu Kaisen game type">
          <button id="characterMode" class="mode-button active" type="button" aria-pressed="true" data-game-type="character">Characters</button>
          <button id="domainMode" class="mode-button" type="button" aria-pressed="false" data-game-type="domain">Domains</button>
          <button id="imageMode" class="mode-button" type="button" aria-pressed="false" data-game-type="image">Blurry images</button>
        </div>
        <div class="mode-switch" role="group" aria-label="Game mode">
          <button id="dailyMode" class="mode-button active" type="button" aria-pressed="true">Daily</button>
          <button id="freeplayMode" class="mode-button" type="button" aria-pressed="false">Freeplay</button>
        </div>
        <p id="modeNote" class="mode-note">Daily character target</p>
        <p id="dailyResetTimer" class="daily-reset-timer" aria-live="polite"></p>
      </div>
    </header>

    <section class="jjk-clue" aria-labelledby="clueTitle">
      <p id="clueLabel">Character clue</p>
      <h2 id="clueTitle">Loading...</h2>
      <p id="clueType"></p>
      <img id="imageClue" class="jjk-image-clue" alt="Blurred mystery character" hidden>
        <img id="imageClue" class="jjk-image-clue" alt="Blurred mystery character" draggable="false" hidden>
    </section>

    <div class="toolbar">
      <div class="controls">
        <div class="guess-count" aria-live="polite">Guesses <b id="guessCount">0</b></div>
        <div class="autocomplete">
          <input id="guessInput" type="text" placeholder="Type a Jujutsu Kaisen character..." aria-label="Guess a Jujutsu Kaisen character" autocomplete="off" aria-autocomplete="list" aria-controls="suggestions">
          <div id="suggestions" class="suggestions" role="listbox"></div>
        </div>
        <button id="guessBtn" type="button">Guess</button>
        <button id="giveUp" type="button" class="secondary">Give up</button>
        <button id="newGame" type="button" class="secondary" hidden>New game</button>
        <button id="appearanceHint" type="button" class="secondary hint-button" hidden>Hint: first arc</button>
        <button id="affiliationHint" type="button" class="secondary hint-button" hidden>Hint: affiliation</button>
      </div>
      <p id="hintMessage" class="hint-message" role="status" aria-live="polite"></p>
    </div>

    <section id="successPanel" class="success-panel" aria-live="polite" aria-labelledby="successTitle" tabindex="-1" hidden>
      <div id="confetti" class="confetti" aria-hidden="true"></div>
      <div class="success-art-wrap"><div id="successMark" class="jjk-success-mark">JJK</div><img id="successImage" class="jjk-success-image" alt=""></div>
      <div class="success-copy">
        <p class="success-kicker">CURSED ENERGY COMPLETE</p>
        <h2 id="successTitle">Character found</h2>
        <p id="successDetails" class="success-details"></p>
        <p id="successGuessCount" class="success-guess-count"></p>
        <button id="successContinue" type="button">Choose another world</button>
        <div id="jjkDailyScore" class="daily-score" hidden>
          <p>All JJK daily modes complete</p>
          <pre id="jjkDailyScoreText"></pre>
          <button id="jjkCopyDailyScore" type="button">Copy results</button>
        </div>
      </div>
    </section>

    <div id="board" aria-label="Jujutsu Kaisen trait board"></div>
    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    const characterCategories = [
      { key: 'name', label: 'Character' }, { key: 'gender', label: 'Gender' }, { key: 'age', label: 'Age' },
      { key: 'grade', label: 'Sorcerer Grade' }, { key: 'classification', label: 'Class' },
      { key: 'firstArc', label: 'Arc Introduced' }, { key: 'affiliation', label: 'Affiliation' }
    ];
    const domainTargets = [
      { user: 'Satoru Gojo', name: 'Unlimited Void', type: 'Domain Expansion' },
      { user: 'Megumi Fushiguro', name: 'Chimera Shadow Garden', type: 'Incomplete Domain' },
      { user: 'Ryomen Sukuna', name: 'Malevolent Shrine', type: 'Domain Expansion' },
      { user: 'Mahito', name: 'Self-Embodiment of Perfection', type: 'Domain Expansion' },
      { user: 'Jogo', name: 'Coffin of the Iron Mountain', type: 'Domain Expansion' },
      { user: 'Dagon', name: 'Horizon of the Captivating Skandha', type: 'Domain Expansion' },
      { user: 'Kinji Hakari', name: 'Idle Death Gamble', type: 'Domain Expansion' },
      { user: 'Yuta Okkotsu', name: 'Authentic Mutual Love', type: 'Domain Expansion' },
      { user: 'Hiromi Higuruma', name: 'Deadly Sentencing', type: 'Domain Expansion' }
    ];
    const classificationByType = { Sorcerer: 'Jujutsu Sorcerer', 'Curse User': 'Curse User', 'Cursed Spirit': 'Curse', 'Cursed Object': 'Curse', 'Cursed Corpse': 'Jujutsu Sorcerer', 'Sorcerer Killer': 'Curse User', 'Death Painting': 'Curse' };
    const gradeByName = { 'Satoru Gojo': 'Special Grade', 'Yuta Okkotsu': 'Special Grade', 'Suguru Geto': 'Special Grade', 'Ryomen Sukuna': 'Special Grade', 'Mahito': 'Special Grade', 'Jogo': 'Special Grade', 'Hanami': 'Special Grade', 'Dagon': 'Special Grade', 'Toji Fushiguro': 'Special Grade', 'Maki Zenin': 'Special Grade', 'Ryu Ishigori': 'Special Grade', 'Yorozu': 'Special Grade', 'Hajime Kashimo': 'Special Grade', 'Naoya Zenin': 'Special Grade', 'Yuji Itadori': 'Grade 1', 'Kento Nanami': 'Grade 1', 'Aoi Todo': 'Grade 1', 'Fumihiko Takaba': 'Grade 1', 'Hiromi Higuruma': 'Grade 1', 'Mechamaru': 'Semi-Grade 1', 'Megumi Fushiguro': 'Grade 2', 'Nobara Kugisaki': 'Grade 3', 'Toge Inumaki': 'Grade 1', 'Panda': 'Grade 2' };
    const gradeOrder = ['Grade 4', 'Grade 3', 'Grade 2', 'Semi-Grade 1', 'Grade 1', 'Special Grade'];
    const arcOrder = { 'Fearsome Womb': 1, 'Cursed Child': 2, 'Hidden Inventory': 3, 'Kyoto Goodwill Event': 4, 'Death Painting': 5, 'Shibuya Incident': 6, 'Culling Game': 7 };
    const board = document.querySelector('#board');
    const guessInput = document.querySelector('#guessInput');
    const suggestions = document.querySelector('#suggestions');
    const guessBtn = document.querySelector('#guessBtn');
    const giveUpBtn = document.querySelector('#giveUp');
    const newGameBtn = document.querySelector('#newGame');
    const guessCount = document.querySelector('#guessCount');
    const message = document.querySelector('#message');
    const clueLabel = document.querySelector('#clueLabel');
    const clueTitle = document.querySelector('#clueTitle');
    const clueType = document.querySelector('#clueType');
    const imageClue = document.querySelector('#imageClue');
    const modeNote = document.querySelector('#modeNote');
    const hintMessage = document.querySelector('#hintMessage');
    const appearanceHint = document.querySelector('#appearanceHint');
    const affiliationHint = document.querySelector('#affiliationHint');
    const successPanel = document.querySelector('#successPanel');
    const successTitle = document.querySelector('#successTitle');
    const successDetails = document.querySelector('#successDetails');
    const successGuessCount = document.querySelector('#successGuessCount');
    const successMark = document.querySelector('#successMark');
    const successImage = document.querySelector('#successImage');
    const jjkDailyScore = document.querySelector('#jjkDailyScore');
    const jjkDailyScoreText = document.querySelector('#jjkDailyScoreText');
    const jjkCopyDailyScore = document.querySelector('#jjkCopyDailyScore');
    const confetti = document.querySelector('#confetti');
    let gameType = 'character';
    let playMode = 'daily';
    let target = null;
    let guesses = [];
    let over = false;
    imageClue.draggable = false;
    imageClue.addEventListener('dragstart', event => event.preventDefault());

    function normalize(value) { return String(value || '').trim().toLowerCase().replace(/\s+/g, ' '); }
    function hashValue(value) { let hash = 2166136261; for (const character of value) { hash ^= character.charCodeAt(0); hash = Math.imul(hash, 16777619); } return Math.abs(hash); }
    function characters() { return jjkCharacters.map(character => ({ ...character, classification: classificationByType[character.type] || 'Civilian', grade: gradeByName[character.name] || 'Grade 3' })); }
    function domainUsers() { return domainTargets.map(domain => ({ ...domain, character: characters().find(character => normalize(character.name) === normalize(domain.user)) })).filter(domain => domain.character); }
    function activePool() { return gameType === 'domain' ? domainUsers() : characters(); }
    function selectTarget() { const pool = activePool(); const index = playMode === 'daily' ? hashValue(`${getMstDateKey()}-${gameType}`) % pool.length : Math.floor(Math.random() * pool.length); return pool[index]; }
    function targetCharacter() { return gameType === 'domain' ? target.character : target; }
    function updateModes() {
      document.querySelectorAll('[data-game-type]').forEach(button => { const active = button.dataset.gameType === gameType; button.classList.toggle('active', active); button.setAttribute('aria-pressed', String(active)); });
      const daily = playMode === 'daily'; document.querySelector('#dailyMode').classList.toggle('active', daily); document.querySelector('#freeplayMode').classList.toggle('active', !daily); document.querySelector('#dailyMode').setAttribute('aria-pressed', String(daily)); document.querySelector('#freeplayMode').setAttribute('aria-pressed', String(!daily));
      modeNote.textContent = `${daily ? 'Daily' : 'Freeplay'} ${gameType === 'character' ? 'character' : gameType === 'domain' ? 'domain' : 'image'} target`; newGameBtn.hidden = daily; document.querySelector('#successContinue').textContent = gameType === 'character' ? 'Next: Domains' : gameType === 'domain' ? 'Next: Blurry Images' : 'Next: Characters';
    }
    const onlineImages = new Map();
    const verifiedOnlineImages = {
      'yuji itadori': 'https://cdn.myanimelist.net/images/characters/6/467646.webp?s=9e1cb7b0c6c7f145661e8ee93f32215d',
      'megumi fushiguro': 'https://cdn.myanimelist.net/images/characters/12/621887.webp?s=fb8e12884d38886ba643f4f2509b22d6',
      'nobara kugisaki': 'https://cdn.myanimelist.net/images/characters/12/422313.webp?s=053db48815610ce7fdc280f62a3499ce',
      'satoru gojo': 'https://cdn.myanimelist.net/images/characters/15/422168.webp?s=7c1dfc26a9b3a6652da616a0fec7af01',
      'maki zenin': 'https://cdn.myanimelist.net/images/characters/15/423949.webp?s=72edfa936ac89421e8d16970762d8b5b',
      'toge inumaki': 'https://cdn.myanimelist.net/images/characters/4/521636.webp?s=ef7b20ebe6e134fc94303c86e5cd1268',
      'panda': 'https://cdn.myanimelist.net/images/characters/16/521637.webp?s=96e961da11b8977e75c6ac39312b3067',
      'yuta okkotsu': 'https://cdn.myanimelist.net/images/characters/10/461503.webp?s=dda1109b054b3b2e6198d91527cfc7ac',
      'kento nanami': 'https://cdn.myanimelist.net/images/characters/16/581424.webp?s=78de007092c9e32f3555753de4999ee6',
      'aoi todo': 'https://cdn.myanimelist.net/images/characters/5/427604.webp?s=4471dfaee135cd387a053f4b6556b2b2',
      'mai zenin': 'https://cdn.myanimelist.net/images/characters/6/430336.webp?s=b958cdf63203469623dcaccb38986280',
      'noritoshi kamo': 'https://cdn.myanimelist.net/images/characters/2/430935.webp?s=43c2932f2095864d481deb8b4f50f551',
      'kasumi miwa': 'https://cdn.myanimelist.net/images/characters/5/431905.webp?s=5baf76ca4b20bd7e4997b80689fda24f',
      'momo nishimiya': 'https://cdn.myanimelist.net/images/characters/9/435453.webp?s=0b7635eeca84125d7aacbdcd743b8eb9',
      'shoko ieiri': 'https://cdn.myanimelist.net/images/characters/13/423951.webp?s=5287a63c8b798f195d1db973df2351de',
      'suguru geto': 'https://cdn.myanimelist.net/images/characters/7/619361.webp?s=f44b1c92fcebfa466ee403e1d77b5d45',
      'toji fushiguro': 'https://s4.anilist.co/file/anilistcdn/character/large/b162722-btzdghBizxKS.jpg',
      'utahime iori': 'https://cdn.myanimelist.net/images/characters/3/435404.webp?s=1627d13c26f9f395bd3c4f286c743bfc',
      'choso': 'https://cdn.myanimelist.net/images/characters/8/524177.webp?s=91bbde7d801299f3ff1fb5d8388cc133',
      'mahito': 'https://cdn.myanimelist.net/images/characters/5/446508.webp?s=8cfa45381097f1e9a720982061ec087d',
      'jogo': 'https://cdn.myanimelist.net/images/characters/11/415336.webp?s=1c6800fbf4d7e4620a8600cd118a0506',
      'hanami': 'https://cdn.myanimelist.net/images/characters/3/414242.webp?s=4543a6b62596f1adf3c1f24fd2f96185',
      'dagon': 'https://cdn.myanimelist.net/images/characters/3/564915.webp?s=ffe03656fac00133a212bf5e7d7bc83b',
      'ryomen sukuna': 'https://s4.anilist.co/file/anilistcdn/character/large/b133701-rCQuDpHr3UZL.png',
      'uraume': 'https://cdn.myanimelist.net/images/characters/2/436733.webp?s=c8089d5c1e35e2368a53f771ad49cf8b',
      'mechamaru': 'https://s4.anilist.co/file/anilistcdn/character/large/b210154-nIn9DX39GFKP.jpg'
    };
    function fallbackPortraitUrl(character) { return `https://tse1.mm.bing.net/th?q=${encodeURIComponent(`${character.name} Jujutsu Kaisen character`)}`; }
    function imageNameKey(value) { return normalize(value).replace(/yuuji/g, 'yuji').replace(/yuuta/g, 'yuta').replace(/ryoumen/g, 'ryomen').replace(/gojou/g, 'gojo').replace(/getou/g, 'geto').replace(/toudou/g, 'todo').replace(/jougo/g, 'jogo').replace(/chousou/g, 'choso').replace(/touji/g, 'toji').replace(/shouko/g, 'shoko').replace(/[^a-z0-9]+/g, ' ').trim().split(' ').sort().join(' '); }
    function portraitStem(character) { return `assets/characters/${normalize(character.name).replace(/[^a-z0-9]+/g, '-')}`; }
    function portraitUrls(character) { const stem = portraitStem(character); const key = normalize(character.name); return [`${stem}.jpg`, `${stem}.webp`, `${stem}.png`, verifiedOnlineImages[key], onlineImages.get(imageNameKey(character.name.full || character.name)), fallbackPortraitUrl(character), 'assets/jjk-background.jpg'].filter(Boolean); }
    function setPortrait(image, character) { const urls = portraitUrls(character); let index = 0; image.onerror = () => { index += 1; image.src = urls[index] || 'assets/jjk-background.jpg'; }; image.src = urls[0]; }
    async function loadOnlineImages() { try { const cached = JSON.parse(localStorage.getItem('jjk-online-images-v1') || '{}'); Object.entries(cached).forEach(([name, image]) => onlineImages.set(name, image)); } catch (error) { } const query = `query ($id: Int!) { Media(id: $id) { characters(perPage: 100) { nodes { name { full } image { large } } } } }`; for (const id of [113415, 145064, 131573]) { try { const response = await fetch('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables: { id } }) }); if (!response.ok) continue; const payload = await response.json(); payload.data?.Media?.characters?.nodes?.forEach(character => { if (character.image?.large) onlineImages.set(imageNameKey(character.name.full), character.image.large); }); } catch (error) { continue; } } localStorage.setItem('jjk-online-images-v1', JSON.stringify(Object.fromEntries(onlineImages))); renderSuggestions(); if (gameType === 'image') setPortrait(imageClue, targetCharacter()); }
    function valueStatus(leftValue, rightValue, key) { const left = String(leftValue ?? 'Unknown'); const right = String(rightValue ?? 'Unknown'); if (left.toLowerCase() === right.toLowerCase()) return 'correct'; if (key === 'age' && Number.isFinite(Number(leftValue)) && Number.isFinite(Number(rightValue)) && Math.abs(Number(leftValue) - Number(rightValue)) <= 5) return 'present'; if (key === 'classification' && (left.toLowerCase().includes(right.toLowerCase()) || right.toLowerCase().includes(left.toLowerCase()))) return 'present'; return 'absent'; }
    function resultText(guess, answer, key) { if (key === 'grade') { const guessRank = gradeOrder.indexOf(guess.grade); const answerRank = gradeOrder.indexOf(answer.grade); return guessRank === answerRank ? guess.grade : `${guess.grade} ${guessRank < answerRank ? '↑' : '↓'}`; } if (key === 'firstArc') { const guessRank = arcOrder[guess.firstArc] || 0; const answerRank = arcOrder[answer.firstArc] || 0; return guessRank === answerRank ? guess.firstArc : `${guess.firstArc} ${guessRank < answerRank ? '↑' : '↓'}`; } if (key !== 'age' || !Number.isFinite(Number(guess.age)) || !Number.isFinite(Number(answer.age))) return guess[key] ?? 'Unknown'; if (guess.age === answer.age) return String(guess.age); return `${guess.age} ${guess.age < answer.age ? '↑' : '↓'}`; }
    function ensureRow(index) { if (board.children[index]) return board.children[index]; const row = document.createElement('div'); row.className = 'row'; const count = gameType === 'character' ? characterCategories.length : 1; for (let i = 0; i < count; i++) row.append(document.createElement('div')); board.append(row); return row; }
    function findCharacter(value) { return characters().find(character => normalize(character.name) === normalize(value)); }
    function renderSuggestions() { const query = normalize(guessInput.value); suggestions.innerHTML = ''; suggestions.hidden = !query; if (!query) return; const matches = characters().filter(character => !guesses.includes(character.name) && normalize(character.name).includes(query)); matches.forEach(character => { const option = document.createElement('button'); option.type = 'button'; option.className = 'suggestion'; const image = document.createElement('img'); image.className = 'jjk-suggestion-image'; image.alt = ''; setPortrait(image, character); const name = document.createElement('span'); name.textContent = character.name; option.append(image, name); option.addEventListener('mousedown', event => event.preventDefault()); option.addEventListener('click', () => { guessInput.value = character.name; suggestions.hidden = true; guessInput.focus(); }); suggestions.append(option); }); suggestions.hidden = matches.length === 0; }
    function renderCharacterGuess(character) { const row = ensureRow(guesses.length); characterCategories.forEach((category, index) => { const tile = row.children[index]; tile.className = `tile ${valueStatus(character[category.key], target[category.key], category.key)} reveal`; tile.style.setProperty('--flip-delay', `${index * 90}ms`); tile.innerHTML = `<span class="trait-label">${category.label}</span><span class="trait-value">${resultText(character, target, category.key)}</span>`; }); }
    function renderAlternateGuess(character) { const row = document.createElement('div'); row.className = 'row'; const tile = document.createElement('div'); const correct = normalize(character.name) === normalize(targetCharacter().name); tile.className = `tile ${correct ? 'correct' : 'absent'} reveal`; tile.innerHTML = `<span class="trait-label">Character</span><span class="trait-value">${character.name}</span>`; row.append(tile); board.prepend(row); }
    function updateHints() { appearanceHint.hidden = guesses.length < 5 || appearanceHint.disabled; affiliationHint.hidden = guesses.length < 9 || affiliationHint.disabled; }
    function readJjkProgress() { try { const saved = JSON.parse(localStorage.getItem('jjk-traitdle-daily-progress') || '{}'); return saved.date === getMstDateKey() ? saved : { date: getMstDateKey(), character: null, domain: null, image: null }; } catch (error) { return { date: getMstDateKey(), character: null, domain: null, image: null }; } }
    function saveJjkScore() { const progress = readJjkProgress(); progress[gameType] = guesses.length; localStorage.setItem('jjk-traitdle-daily-progress', JSON.stringify(progress)); return progress; }
    function showJjkScore(progress) { return ['character', 'domain', 'image'].every(mode => Number.isFinite(progress[mode]) || readDailyGameState('jjk-traitdle-daily-guesses', mode).over); }
    function formatJjkScore(progress) { return appendShareLink([`I've completed all the modes of #JujutsuKaisen Traitdle today:`, `🧿 Characters: ${progress.character ?? '-'}`, `🏯 Domains: ${progress.domain ?? '-'}`, `🖼️ Blurry images: ${progress.image ?? '-'}`].join('\n'), traitdleWorldUrls.jjk); }
    function resetGame() { const savedState = playMode === 'daily' ? readDailyGameState('jjk-traitdle-daily-guesses', gameType) : { guesses: [], over: false }; guesses = savedState.guesses; over = savedState.over; target = selectTarget(); board.innerHTML = ''; guessInput.value = ''; suggestions.hidden = true; message.textContent = ''; hintMessage.textContent = ''; guessCount.textContent = String(guesses.length); appearanceHint.hidden = true; affiliationHint.hidden = true; appearanceHint.disabled = false; affiliationHint.disabled = false; successPanel.hidden = true; successPanel.classList.add('image-victory'); jjkDailyScore.hidden = true; confetti.innerHTML = ''; guessBtn.disabled = over; giveUpBtn.disabled = over; updateModes(); imageClue.hidden = gameType !== 'image'; imageClue.style.filter = ''; imageClue.style.transform = ''; successMark.hidden = true; successImage.hidden = false; clueLabel.textContent = gameType === 'character' ? 'Character clue' : gameType === 'domain' ? 'Domain expansion clue' : 'Blurry image clue'; if (gameType === 'character') { clueTitle.textContent = 'Find the character from the traits below'; clueType.textContent = 'Name, gender, age, grade, class, arc, affiliation'; } else if (gameType === 'domain') { clueTitle.textContent = target.name; clueType.textContent = target.type; } else { clueTitle.textContent = 'Who is this?'; clueType.textContent = 'Identify the blurred character'; setPortrait(imageClue, target); } guesses.forEach(name => { const character = findCharacter(name); if (character) gameType === 'character' ? renderCharacterGuess(character) : renderAlternateGuess(character); }); if (over) showSuccess(); }
    function showSuccess() { const character = targetCharacter(); const progress = playMode === 'daily' ? saveJjkScore() : readJjkProgress(); const allModesComplete = showJjkScore(progress); if (gameType === 'image') { imageClue.style.filter = 'none'; imageClue.style.transform = 'none'; successImage.src = imageClue.currentSrc || imageClue.src; } else setPortrait(successImage, character); successTitle.textContent = character.name; successDetails.textContent = `${character.power} · ${character.affiliation}`; successGuessCount.textContent = `${guesses.length} ${guesses.length === 1 ? 'guess' : 'guesses'}`; jjkDailyScore.hidden = gameType !== 'image' || playMode !== 'daily' || !allModesComplete; if (!jjkDailyScore.hidden) { const scoreText = formatJjkScore(progress); jjkDailyScoreText.textContent = scoreText; enableCopyButton(jjkCopyDailyScore, scoreText); } successImage.hidden = false; successImage.alt = character.name; successPanel.hidden = false; for (let index = 0; index < 24; index++) { const piece = document.createElement('i'); piece.style.setProperty('--x', `${Math.random() * 100}%`); piece.style.setProperty('--color', ['#d8b7ff', '#d85c77', '#5db894'][index % 3]); piece.style.setProperty('--delay', `${Math.random() * 180}ms`); confetti.append(piece); } successPanel.focus({ preventScroll: true }); }
    function submitGuess() { const character = findCharacter(guessInput.value); if (!character) { message.textContent = 'Choose a character from the suggestions.'; return; } if (guesses.includes(character.name)) { message.textContent = 'You already guessed that character.'; return; } if (gameType === 'character') renderCharacterGuess(character); else renderAlternateGuess(character); guesses.push(character.name); guessCount.textContent = String(guesses.length); updateHints(); guessInput.value = ''; suggestions.hidden = true; if (normalize(character.name) === normalize(targetCharacter().name)) { over = true; guessBtn.disabled = true; giveUpBtn.disabled = true; message.textContent = `Correct. ${character.name} was the answer.`; } if (playMode === 'daily') saveDailyGameState('jjk-traitdle-daily-guesses', gameType, guesses, over); if (over) showSuccess(); }
    document.querySelectorAll('[data-game-type]').forEach(button => button.addEventListener('click', () => { gameType = button.dataset.gameType; resetGame(); }));
    document.querySelector('#dailyMode').addEventListener('click', () => { playMode = 'daily'; resetGame(); }); document.querySelector('#freeplayMode').addEventListener('click', () => { playMode = 'freeplay'; resetGame(); }); newGameBtn.addEventListener('click', resetGame);
    guessBtn.addEventListener('click', () => { if (!over) submitGuess(); }); giveUpBtn.addEventListener('click', () => { over = true; guessBtn.disabled = true; giveUpBtn.disabled = true; if (gameType === 'image') { imageClue.style.filter = 'none'; imageClue.style.transform = 'none'; } message.textContent = `The hidden character was ${targetCharacter().name}.`; if (playMode === 'daily') saveDailyGameState('jjk-traitdle-daily-guesses', gameType, guesses, over); });
    appearanceHint.addEventListener('click', () => { hintMessage.textContent += `${hintMessage.textContent ? ' ' : ''}First appeared in the ${targetCharacter().firstArc} arc.`; appearanceHint.disabled = true; appearanceHint.hidden = true; }); affiliationHint.addEventListener('click', () => { hintMessage.textContent += `${hintMessage.textContent ? ' ' : ''}Affiliation: ${targetCharacter().affiliation}.`; affiliationHint.disabled = true; affiliationHint.hidden = true; });
    guessInput.addEventListener('input', renderSuggestions); guessInput.addEventListener('keydown', event => { if (event.key === 'Enter' && !suggestions.hidden) { event.preventDefault(); suggestions.querySelector('button')?.click(); } else if (event.key === 'Enter' && !over) submitGuess(); }); document.querySelector('#successContinue').addEventListener('click', () => { gameType = gameType === 'character' ? 'domain' : gameType === 'domain' ? 'image' : 'character'; resetGame(); });
    startDailyResetTimer(document.querySelector('#dailyResetTimer')); resetGame(); loadOnlineImages();
    giveUpBtn.addEventListener('click', () => {
      const character = targetCharacter();
      if (gameType === 'image' && playMode === 'daily') {
        const progress = readJjkProgress();
        progress.image = null;
        localStorage.setItem('jjk-traitdle-daily-progress', JSON.stringify(progress));
        const allModesComplete = showJjkScore(progress);
        const scoreText = formatJjkScore(progress).replace(/🖼️ Blurry images: -?\d*/, '🖼️ Blurry images: -');
        jjkDailyScoreText.textContent = scoreText;
        jjkDailyScore.hidden = !allModesComplete;
        if (!jjkDailyScore.hidden) enableCopyButton(jjkCopyDailyScore, scoreText);
      } else jjkDailyScore.hidden = true;
      successPanel.querySelector('.success-kicker').textContent = 'ROUND OVER';
      successTitle.textContent = 'The answer was revealed';
      successDetails.textContent = `${character.power} · ${character.affiliation}`;
      successGuessCount.textContent = `${guesses.length} ${guesses.length === 1 ? 'guess' : 'guesses'}`;
      if (gameType === 'image') { imageClue.style.filter = 'none'; imageClue.style.transform = 'none'; successImage.src = imageClue.currentSrc || imageClue.src; } else setPortrait(successImage, character);
      successImage.alt = character.name;
      successPanel.hidden = false;
      successPanel.focus({ preventScroll: true });
    });
  </script>
</body>
