<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Clover Traitdle</title><link rel="stylesheet" href="../one-piece/file.css"><link rel="stylesheet" href="black-clover.css"><script src="black-clover-data.js"></script><script src="../one-piece/daily-utils.js"></script></head><body><main class="game bc-game"><header><a class="home-link" href="../index.html">All worlds</a><div class="masthead-shade"></div><div class="masthead-content"><div class="eyebrow">TRAITDLE / BLACK CLOVER</div><h1>CLOVER DLE</h1><p class="subtitle">Read the magic. Find the mage.</p><div class="mode-switch"><button id="characterMode" class="mode-button active">Characters</button><button id="imageMode" class="mode-button">Blurry images</button></div><div class="mode-switch"><button id="dailyMode" class="mode-button active">Daily</button><button id="freeplayMode" class="mode-button">Freeplay</button></div><p id="modeNote" class="mode-note">Daily character target</p></div></header><section class="world-clue"><p>Character clue</p><h2 id="clueTitle">Find the character from the traits below</h2><img id="imageClue" alt="Blurred mystery character" hidden></section><div class="toolbar"><div class="controls"><div class="guess-count">Guesses <b id="guessCount">0</b></div><div class="autocomplete"><input id="guessInput" placeholder="Type a Black Clover character..." autocomplete="off"><div id="suggestions" class="suggestions"></div></div><button id="guessBtn">Guess</button><button id="giveUp" class="secondary">Give up</button><button id="newGame" class="secondary" hidden>New game</button></div><p id="message" class="hint-message" role="status"></p></div><section id="successPanel" class="success-panel" hidden tabindex="-1"><div class="success-art-wrap"><img id="successImage" alt=""></div><div class="success-copy"><p class="success-kicker">ANSWER REVEALED</p><h2 id="successTitle"></h2><p id="successDetails" class="success-details"></p><p id="successGuessCount"></p><button id="successContinue">Next mode</button><div id="dailyScore" class="daily-score" hidden><pre id="dailyScoreText"></pre><button id="copyDailyScore">Copy results</button></div></div></section><div id="board"></div></main><script>
const data=blackCloverCharacters,categories=[['name','Character'],['gender','Gender'],['age','Age'],['hairColor','Hair colour'],['magic','Magic attribute'],['species','Species'],['faction','Squad / faction'],['arc','First arc']],key='black-clover-traitdle';let mode='character',play='daily',target=null,guesses=[],over=false;const $=id=>document.querySelector(id),board=$('#board'),input=$('#guessInput'),suggestions=$('#suggestions'),count=$('#guessCount'),message=$('#message'),panel=$('#successPanel'),score=$('#dailyScore'),scoreText=$('#dailyScoreText');function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}function hash(v){let n=2166136261;for(const c of v){n^=c.charCodeAt(0);n=Math.imul(n,16777619)}return Math.abs(n)}function status(g,a,k){if(g[k]===a[k])return'correct';if(k==='age'&&Number(g[k])&&Number(a[k]))return Number(g[k])<Number(a[k])?'higher':'lower';return'absent'}function shown(g,a,k){if(g[k]===a[k])return g[k];if(k==='age'&&Number(g[k])&&Number(a[k]))return`${g[k]} ${Number(g[k])<Number(a[k])?'↑':'↓'}`;return g[k]}function renderSuggestions(){suggestions.innerHTML='';let q=norm(input.value);if(!q){suggestions.hidden=true;return}data.filter(c=>!guesses.includes(c.name)&&norm(c.name).includes(q)).forEach(c=>{let b=document.createElement('button'),i=document.createElement('img'),s=document.createElement('span');b.className='suggestion';i.src=c.image;s.textContent=c.name;b.append(i,s);b.onclick=()=>{input.value=c.name;suggestions.hidden=true};suggestions.append(b)});suggestions.hidden=!suggestions.children.length}function render(c){let r=document.createElement('div');r.className='row';categories.forEach(([k,l],i)=>{let t=document.createElement('div');t.className=`tile ${status(c,target,k)} reveal`;t.style.setProperty('--flip-delay',`${i*70}ms`);t.innerHTML=`<span class="trait-label">${l}</span><span class="trait-value">${shown(c,target,k)}</span>`;r.append(t)});board.prepend(r)}function renderImage(c,correct){let r=document.createElement('div');r.className='row';r.innerHTML=`<div class="tile ${correct?'correct':'absent'} reveal"><span class="trait-label">Character</span><span class="trait-value">${c.name}</span></div>`;board.prepend(r)}function save(result=null){if(play==='daily')saveDailyGameState(`${key}-daily`,mode,guesses,over,result)}function finish(won){over=true;save(won?'solved':'gave-up');$('#guessBtn').disabled=$('#giveUp').disabled=input.disabled=true;$('#newGame').hidden=play==='daily';panel.hidden=false;$('#successImage').src=target.image;$('#successTitle').textContent=won?`Correct: ${target.name}`:target.name;$('#successDetails').textContent='A Black Clover mystery solved.';$('#successGuessCount').textContent=won?`Solved in ${guesses.length} guesses.`:'The answer was revealed.';if(play==='daily'){const states=['character','image'].map(modeKey=>readDailyGameState('black-clover-traitdle-daily',modeKey));if(states.every(state=>state.over)){const scoreValue=state=>state.result==='gave-up'?'-':state.guesses.length===0?'X':state.guesses.length;score.hidden=false;scoreText.textContent=appendShareLink("I've completed all modes of #BlackClover Traitdle today:"+"\n\u2618\uFE0F Characters: "+scoreValue(states[0])+"\n\u{1F4D6} Blurry images: "+scoreValue(states[1]),traitdleWorldUrls.blackClover)}else score.hidden=true}}function start(){board.innerHTML='';guesses=[];over=false;panel.hidden=true;score.hidden=true;input.disabled=$('#guessBtn').disabled=$('#giveUp').disabled=false;$('#newGame').hidden=true;count.textContent=0;let saved=play==='daily'?readDailyGameState(`${key}-daily`,mode):{guesses:[],over:false};target=play==='daily'?data[hash(`${key}-${getMstDateKey()}-${mode}`)%data.length]:data[Math.floor(Math.random()*data.length)];if(saved.over){guesses=saved.guesses;guesses.forEach(n=>{let c=data.find(x=>x.name===n);if(c)mode==='character'?render(c):renderImage(c,c.name===target.name)});count.textContent=guesses.length;finish(guesses.includes(target.name));return}$('#imageClue').hidden=mode!=='image';$('#clueTitle').hidden=mode==='image';if(mode==='image')$('#imageClue').src=target.image}function setMode(m){mode=m;document.querySelectorAll('#characterMode,#imageMode').forEach(b=>b.classList.toggle('active',b.id.toLowerCase().startsWith(m)));start()}function submit(){if(over)return;let c=data.find(x=>norm(x.name)===norm(input.value));if(!c){message.textContent='Choose a character from the suggestions.';return}if(guesses.includes(c.name)){message.textContent='That character has already been guessed.';return}guesses.push(c.name);count.textContent=guesses.length;mode==='character'?render(c):renderImage(c,c.name===target.name);input.value='';suggestions.hidden=true;save();if(c.name===target.name)finish(true)}$('#characterMode').onclick=()=>setMode('character');$('#imageMode').onclick=()=>setMode('image');function setPlay(p){play=p;const daily=p==='daily';$('#dailyMode').classList.toggle('active',daily);$('#freeplayMode').classList.toggle('active',!daily);$('#dailyMode').setAttribute('aria-pressed',String(daily));$('#freeplayMode').setAttribute('aria-pressed',String(!daily));$('#modeNote').textContent=`${daily?'Daily':'Freeplay'} ${mode==='character'?'character':'image'} target`;start()}$('#dailyMode').onclick=()=>setPlay('daily');$('#freeplayMode').onclick=()=>setPlay('freeplay');$('#guessBtn').onclick=submit;$('#giveUp').onclick=()=>finish(false);$('#newGame').onclick=start;$('#successContinue').onclick=()=>setMode(mode==='character'?'image':'character');input.oninput=renderSuggestions;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();let exact=data.find(c=>norm(c.name)===norm(input.value));if(exact){submit();return}let first=suggestions.querySelector('.suggestion');if(first){input.value=first.textContent;suggestions.hidden=true}}};start();
</script></body></html>
