<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokemon Traitdle</title>
  <link rel="stylesheet" href="../one-piece/file.css">
  <link rel="stylesheet" href="pokemon.css">
  <script src="../one-piece/daily-utils.js"></script>
  <script src="pokemon-data.js"></script>
</head>
<body>
  <main class="game pokemon-game">
    <header>
      <a class="home-link" href="../index.html">All worlds</a>
      <div class="masthead-content">
        <div class="eyebrow">TRAITDLE / POKEMON</div>
        <h1>POKEDLE</h1>
        <p class="subtitle">Read the clues. Find the Pokemon.</p>
        <div class="mode-switch" role="group" aria-label="Pokemon game type">
          <button class="mode-button active" data-mode="classic" aria-pressed="true">Classic</button>
          <button class="mode-button" data-mode="move" aria-pressed="false">Signature moves</button>
          <button class="mode-button" data-mode="silhouette" aria-pressed="false">Silhouettes</button>
        </div>
        <div class="mode-switch" role="group" aria-label="Game mode">
          <button id="dailyMode" class="mode-button active" aria-pressed="true">Daily</button>
          <button id="freeplayMode" class="mode-button" aria-pressed="false">Freeplay</button>
        </div>
        <p id="modeNote" class="mode-note">Daily Pokemon target</p>
        <p id="dailyResetTimer" class="daily-reset-timer" aria-live="polite"></p>
      </div>
    </header>

    <section id="clue" class="pokemon-clue" aria-live="polite">
      <p id="clueLabel">Pokemon clue</p>
      <h2 id="clueTitle">Find the Pokemon from its traits</h2>
      <img id="silhouette" alt="Mystery Pokemon silhouette" hidden>
    </section>
    <div class="toolbar">
      <div class="controls">
        <div class="guess-count">Guesses <b id="guessCount">0</b></div>
        <div class="autocomplete"><input id="guessInput" placeholder="Type a Pokemon name..." autocomplete="off" aria-label="Guess a Pokemon"><div id="suggestions" class="suggestions"></div></div>
        <button id="guessBtn">Guess</button>
        <button id="giveUp" class="secondary">Give up</button>
        <button id="newGame" class="secondary" hidden>New game</button>
      </div>
      <p id="message" class="hint-message" role="status"></p>
    </div>
    <section id="successPanel" class="success-panel" hidden tabindex="-1">
      <div class="success-art-wrap"><img id="successImage" class="pokemon-success-image" alt=""></div>
      <div class="success-copy"><p class="success-kicker">POKEDEX COMPLETE</p><h2 id="successTitle"></h2><p id="successDetails" class="success-details"></p><p id="successGuessCount"></p><button id="successContinue">Next Pokemon mode</button><div id="dailyScore" class="daily-score" hidden><pre id="dailyScoreText"></pre><button id="copyDailyScore">Copy results</button></div></div>
    </section>
    <div id="board" aria-label="Pokemon trait board"></div>
  </main>
  <script>
    const modes = ['classic', 'move', 'silhouette'];
    const categories = [
      { key: 'name', label: 'Pokemon' }, { key: 'primary', label: 'Primary type' }, { key: 'secondary', label: 'Secondary type' },
      { key: 'evolutionStage', label: 'Evolution stage' }, { key: 'height', label: 'Height' }, { key: 'weight', label: 'Weight' }, { key: 'generation', label: 'Generation' }
    ];
    const board = document.querySelector('#board');
    const input = document.querySelector('#guessInput');
    const suggestions = document.querySelector('#suggestions');
    const message = document.querySelector('#message');
    const modeNote = document.querySelector('#modeNote');
    const silhouette = document.querySelector('#silhouette');
    const clueTitle = document.querySelector('#clueTitle');
    const guessCount = document.querySelector('#guessCount');
    const guessButton = document.querySelector('#guessBtn');
    const giveUp = document.querySelector('#giveUp');
    const newGame = document.querySelector('#newGame');
    const successPanel = document.querySelector('#successPanel');
    const successImage = document.querySelector('#successImage');
    const successTitle = document.querySelector('#successTitle');
    const successDetails = document.querySelector('#successDetails');
    const successGuessCount = document.querySelector('#successGuessCount');
    const dailyScore = document.querySelector('#dailyScore');
    const dailyScoreText = document.querySelector('#dailyScoreText');
    const copyDailyScore = document.querySelector('#copyDailyScore');
    let mode = 'classic', playMode = 'daily', target, guesses = [], over = false;
    const progressKey = 'pokemon-traitdle-daily-progress';

    function normalize(value) { return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
    function hash(value) { let result = 2166136261; for (const character of value) { result ^= character.charCodeAt(0); result = Math.imul(result, 16777619); } return Math.abs(result); }
    function todayProgress() { const date = getMstDateKey(); try { const saved = JSON.parse(localStorage.getItem(progressKey) || '{}'); return saved.date === date ? saved : { date, classic: null, move: null, silhouette: null }; } catch { return { date, classic: null, move: null, silhouette: null }; } }
    function saveScore(score) { const progress = todayProgress(); progress[mode] = score; localStorage.setItem(progressKey, JSON.stringify(progress)); return progress; }
    function imageUrl(pokemon) { return pokemon.image; }
    function displayName(value) { return String(value).replace(/\b\w/g, letter => letter.toUpperCase()); }
    function status(guess, answer, key) {
      if (key === 'name') return normalize(guess.name) === normalize(answer.name) ? 'correct' : 'absent';
      if (key === 'primary' || key === 'secondary') return guess[key] && guess[key] === answer[key] ? 'correct' : guess[key] && (guess[key] === answer.primary || guess[key] === answer.secondary) ? 'present' : 'absent';
      if (guess[key] === answer[key]) return 'correct';
      return Number(guess[key]) < Number(answer[key]) ? 'higher' : 'lower';
    }
    function resultValue(guess, answer, key) { if (key === 'name' || key === 'primary' || key === 'secondary') return guess[key] || 'None'; if (key === 'height' || key === 'weight') { const value = key === 'height' ? `${guess[key] / 10} m` : `${guess[key] / 10} kg`; return guess[key] === answer[key] ? value : `${value} ${guess[key] < answer[key] ? '↑' : '↓'}`; } if (key === 'evolutionStage') return guess[key] === answer[key] ? `Stage ${guess[key]}` : `Stage ${guess[key]} ${guess[key] < answer[key] ? '↑' : '↓'}`; if (key === 'generation') return guess[key] === answer[key] ? `Gen ${guess[key]}` : `Gen ${guess[key]} ${guess[key] < answer[key] ? '↑' : '↓'}`; return guess[key]; }
    function setModes() { document.querySelectorAll('[data-mode]').forEach(button => { const active = button.dataset.mode === mode; button.classList.toggle('active', active); button.setAttribute('aria-pressed', String(active)); }); const daily = playMode === 'daily'; dailyMode.classList.toggle('active', daily); freeplayMode.classList.toggle('active', !daily); dailyMode.setAttribute('aria-pressed', String(daily)); freeplayMode.setAttribute('aria-pressed', String(!daily)); modeNote.textContent = `${daily ? 'Daily' : 'Freeplay'} ${mode === 'classic' ? 'Pokemon target' : mode === 'move' ? 'signature move target' : 'silhouette target'}`; newGame.hidden = daily; }
    function renderSuggestions() { const query = normalize(input.value); suggestions.innerHTML = ''; suggestions.hidden = !query; if (!query) return; const matches = pokemonData.filter(pokemon => !guesses.includes(pokemon.id) && normalize(pokemon.name).includes(query)).slice(0, 14); matches.forEach(pokemon => { const button = document.createElement('button'); button.type = 'button'; button.className = 'pokemon-suggestion'; const image = document.createElement('img'); image.className = 'pokemon-suggestion-image'; image.alt = ''; image.src = imageUrl(pokemon); const name = document.createElement('span'); name.textContent = pokemon.name; button.append(image, name); button.addEventListener('mousedown', event => event.preventDefault()); button.addEventListener('click', () => { input.value = pokemon.name; suggestions.hidden = true; input.focus(); }); suggestions.append(button); }); suggestions.hidden = !matches.length; }
    function renderClassicGuess(guess) { const row = document.createElement('div'); row.className = 'row'; categories.forEach((category, index) => { const tile = document.createElement('div'); tile.className = `tile ${status(guess, target, category.key)} reveal`; tile.style.setProperty('--flip-delay', `${index * 90}ms`); tile.innerHTML = `<span class="trait-label">${category.label}</span><span class="trait-value">${resultValue(guess, target, category.key)}</span>`; row.append(tile); }); board.prepend(row); }
    function renderAlternateGuess(guess, correct) { const row = document.createElement('div'); row.className = `pokemon-guess ${correct ? 'correct' : ''}`; row.innerHTML = `<span>${guess.name}</span><b>${correct ? 'Correct' : 'Not this Pokemon'}</b>`; board.prepend(row); }
    function resetGame() { const pool = mode === 'move' ? pokemonData.filter(pokemon => pokemon.signatureMove) : pokemonData; const index = playMode === 'daily' ? hash(`${getMstDateKey()}-${mode}`) % pool.length : Math.floor(Math.random() * pool.length); target = pool[index]; const savedState = playMode === 'daily' ? readDailyGameState('pokemon-traitdle-daily-guesses', mode) : { guesses: [], over: false }; guesses = savedState.guesses; over = savedState.over; board.innerHTML = ''; input.value = ''; suggestions.hidden = true; message.textContent = ''; guessCount.textContent = String(guesses.length); guessButton.disabled = over; giveUp.disabled = over; successPanel.hidden = true; dailyScore.hidden = true; silhouette.hidden = mode !== 'silhouette'; silhouette.classList.toggle('revealed', false); silhouette.src = mode === 'silhouette' ? imageUrl(target) : ''; clueTitle.textContent = mode === 'classic' ? 'Find the Pokemon from its traits' : mode === 'move' ? target.signatureMove : 'Who is this Pokemon?'; document.querySelector('#clueLabel').textContent = mode === 'classic' ? 'Pokemon clue' : mode === 'move' ? 'Signature move clue' : 'Silhouette clue'; setModes(); guesses.forEach(id => { const guess = pokemonData.find(pokemon => pokemon.id === id); if (guess) mode === 'classic' ? renderClassicGuess(guess) : renderAlternateGuess(guess, guess.id === target.id); }); if (over) showSuccess(); }
    function showSuccess() { const progress = playMode === 'daily' ? saveScore(guesses.length) : todayProgress(); successImage.src = imageUrl(target); successImage.alt = target.name; successTitle.textContent = target.name; successDetails.textContent = `${target.types.join(' / ')} · Generation ${target.generation}`; successGuessCount.textContent = `${guesses.length} ${guesses.length === 1 ? 'guess' : 'guesses'}`; if (mode === 'silhouette') silhouette.classList.add('revealed'); dailyScore.hidden = !(playMode === 'daily' && mode === 'silhouette'); if (!dailyScore.hidden) { dailyScoreText.textContent = `I've completed all modes of #Pokemon Traitdle today:\nClassic: ${progress.classic ?? '-'}\nSignature moves: ${progress.move ?? '-'}\nSilhouettes: ${progress.silhouette ?? '-'}`; enableCopyButton(copyDailyScore, dailyScoreText.textContent); } successPanel.hidden = false; successPanel.focus({ preventScroll: true }); }
    function submitGuess() { const guess = pokemonData.find(pokemon => normalize(pokemon.name) === normalize(input.value)); if (!guess) { message.textContent = 'Choose a Pokemon from the suggestions.'; return; } if (guesses.includes(guess.id)) { message.textContent = 'You already guessed that Pokemon.'; return; } guesses.push(guess.id); guessCount.textContent = guesses.length; const correct = guess.id === target.id; if (mode === 'classic') renderClassicGuess(guess); else renderAlternateGuess(guess, correct); input.value = ''; suggestions.hidden = true; if (correct) { over = true; guessButton.disabled = true; giveUp.disabled = true; message.textContent = `Correct. ${target.name} was the answer.`; } if (playMode === 'daily') saveDailyGameState('pokemon-traitdle-daily-guesses', mode, guesses, over); if (correct) showSuccess(); }
    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => { mode = button.dataset.mode; resetGame(); }));
    dailyMode.addEventListener('click', () => { playMode = 'daily'; resetGame(); }); freeplayMode.addEventListener('click', () => { playMode = 'freeplay'; resetGame(); }); newGame.addEventListener('click', resetGame); guessButton.addEventListener('click', () => { if (!over) submitGuess(); }); giveUp.addEventListener('click', () => { over = true; guessButton.disabled = true; giveUp.disabled = true; if (mode === 'silhouette') silhouette.classList.add('revealed'); message.textContent = `The hidden Pokemon was ${target.name}.`; if (playMode === 'daily') saveDailyGameState('pokemon-traitdle-daily-guesses', mode, guesses, over); }); input.addEventListener('input', renderSuggestions); input.addEventListener('keydown', event => { if (event.key === 'Enter' && !suggestions.hidden) { event.preventDefault(); suggestions.querySelector('button')?.click(); } else if (event.key === 'Enter' && !over) submitGuess(); }); document.querySelector('#successContinue').addEventListener('click', () => { mode = modes[(modes.indexOf(mode) + 1) % modes.length]; resetGame(); }); startDailyResetTimer(document.querySelector('#dailyResetTimer')); resetGame();
    giveUp.addEventListener('click', () => {
      successPanel.querySelector('.success-kicker').textContent = 'ROUND OVER';
      successTitle.textContent = 'The answer was revealed';
      successDetails.textContent = `${target.types.join(' / ')} · Generation ${target.generation}`;
      successGuessCount.textContent = `${guesses.length} ${guesses.length === 1 ? 'guess' : 'guesses'}`;
      if (mode === 'silhouette' && playMode === 'daily') {
        const progress = todayProgress();
        progress.silhouette = null;
        dailyScoreText.textContent = `I've completed all modes of #Pokemon Traitdle today:\nClassic: ${progress.classic ?? '-'}\nSignature moves: ${progress.move ?? '-'}\nSilhouettes: -`;
        dailyScore.hidden = false;
        enableCopyButton(copyDailyScore, dailyScoreText.textContent);
      } else dailyScore.hidden = true;
      successImage.src = imageUrl(target);
      successImage.alt = target.name;
      if (mode === 'silhouette') silhouette.classList.add('revealed');
      successPanel.hidden = false;
      successPanel.focus({ preventScroll: true });
    });
  </script>
</body>
</html>
