<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fullmetal Alchemist Traitdle</title><link rel="stylesheet" href="../one-piece/file.css"><link rel="stylesheet" href="fullmetal-alchemist.css"><script src="fullmetal-alchemist-data.js"></script><script src="../one-piece/daily-utils.js"></script></head>
<body><main class="game fullmetal-game"><header><a class="home-link" href="../index.html">All worlds</a><div class="masthead-shade"></div><div class="masthead-content"><div class="eyebrow">TRAITDLE / FULLMETAL ALCHEMIST</div><h1>FULLMETAL DLE</h1><p class="subtitle">Read the alchemy. Find the alchemist.</p><div class="mode-switch"><button id="characterMode" class="mode-button active">Characters</button><button id="imageMode" class="mode-button">Blurry images</button></div><div class="mode-switch"><button id="dailyMode" class="mode-button active">Daily</button><button id="freeplayMode" class="mode-button">Freeplay</button></div><p id="modeNote" class="mode-note">Daily character target</p></div></header><section class="fullmetal-clue"><p>Character clue</p><h2 id="clueTitle">Find the character from the traits below</h2><img id="imageClue" class="fullmetal-image-clue" alt="Blurred mystery character" hidden></section><div class="toolbar"><div class="controls"><div class="guess-count">Guesses <b id="guessCount">0</b></div><div class="autocomplete"><input id="guessInput" placeholder="Type a Fullmetal Alchemist character..." autocomplete="off"><div id="suggestions" class="suggestions"></div></div><button id="guessBtn">Guess</button><button id="giveUp" class="secondary">Give up</button><button id="newGame" class="secondary" hidden>New game</button></div><p id="message" class="hint-message" role="status"></p></div><section id="successPanel" class="success-panel" hidden tabindex="-1"><div class="success-art-wrap"><img id="successImage" alt=""></div><div class="success-copy"><p class="success-kicker">EQUIVALENT EXCHANGE COMPLETE</p><h2 id="successTitle"></h2><p id="successDetails" class="success-details"></p><p id="successGuessCount"></p><button id="successContinue">Next Fullmetal mode</button><div id="dailyScore" class="daily-score" hidden><pre id="dailyScoreText"></pre><button id="copyDailyScore">Copy results</button></div></div></section><div id="board" aria-label="Fullmetal Alchemist character trait board"></div></main>
<script>
const data=fullmetalCharacters,categories=[['name','Character'],['gender','Gender'],['age','Age'],['alchemy','Alchemy / skill'],['species','Species'],['faction','Affiliation'],['rank','Rank / role'],['firstArc','First arc introduced'],['birthplace','Origin']],orders={firstArc:{'Liore':1,'Central City':2,'Laboratory 5':3,'Dublith':4,'Xing':5,'Briggs':6,'Promised Day':7,'Finale':8}},key='fullmetal-alchemist-traitdle',mode='character',play='daily'; let target=null,guesses=[],over=false;
const $=id=>document.querySelector(id),board=$('#board'),input=$('#guessInput'),suggestions=$('#suggestions'),count=$('#guessCount'),message=$('#message'),panel=$('#successPanel'),imageClue=$('#imageClue'),title=$('#clueTitle'),score=$('#dailyScore'),scoreText=$('#dailyScoreText');
function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}function hash(v){let n=2166136261;for(const c of v){n^=c.charCodeAt(0);n=Math.imul(n,16777619)}return Math.abs(n)}function order(v,k){return k==='age'?Number(v)||0:orders[k]?.[v]??null}function status(g,a,k){if(g[k]===a[k])return'correct';let x=order(g[k],k),y=order(a[k],k);return x!==null&&y!==null?(x<y?'higher':'lower'):'absent'}function shown(g,a,k){if(g[k]===a[k])return g[k];let x=order(g[k],k),y=order(a[k],k);return x!==null&&y!==null?`${g[k]} ${x<y?'↑':'↓'}`:g[k]}
function renderSuggestions(){suggestions.innerHTML='';let q=norm(input.value);if(!q){suggestions.hidden=true;return}data.filter(c=>!guesses.includes(c.name)&&norm(c.name).includes(q)).forEach(c=>{let b=document.createElement('button'),i=document.createElement('img'),s=document.createElement('span');b.className='suggestion';b.type='button';i.src=c.image;s.textContent=c.name;b.append(i,s);b.onclick=()=>{input.value=c.name;suggestions.hidden=true};suggestions.append(b)});suggestions.hidden=!suggestions.children.length}function render(c){let r=document.createElement('div');r.className='row';categories.forEach(([k,l],i)=>{let t=document.createElement('div');t.className=`tile ${status(c,target,k)} reveal`;t.style.setProperty('--flip-delay',`${i*70}ms`);t.innerHTML=`<span class="trait-label">${l}</span><span class="trait-value">${shown(c,target,k)}</span>`;r.append(t)});board.prepend(r)}function renderImage(c,correct){let r=document.createElement('div');r.className='row';r.innerHTML=`<div class="tile ${correct?'correct':'absent'} reveal"><img class="guess-image" src="${c.image}" alt="${c.name}"><span class="trait-label">${c.name}</span></div>`;board.prepend(r)}
function save(){if(play==='daily')saveDailyGameState(`${key}-daily-guesses`,mode,guesses,over)}function finish(won){over=true;save();$('#guessBtn').disabled=$('#giveUp').disabled=input.disabled=true;$('#newGame').hidden=play==='daily';panel.hidden=false;$('#successImage').src=target.image;$('#successTitle').textContent=won?`Correct: ${target.name}`:target.name;$('#successDetails').textContent='Equivalent exchange complete.';$('#successGuessCount').textContent=won?`Solved in ${guesses.length} guesses.`:'The answer was revealed.';if(play==='daily'){score.hidden=false;scoreText.textContent=`FMA ${mode}: ${won?guesses.length:'X'}`}}
function start(){board.innerHTML='';guesses=[];over=false;panel.hidden=true;input.disabled=$('#guessBtn').disabled=$('#giveUp').disabled=false;$('#newGame').hidden=true;count.textContent=0;let saved=play==='daily'?readDailyGameState(`${key}-daily-guesses`,mode):{guesses:[],over:false};target=play==='daily'?data[hash(`${key}-${getMstDateKey()}-${mode}`)%data.length]:data[Math.floor(Math.random()*data.length)];if(saved.over){guesses=saved.guesses;guesses.forEach(n=>{let c=data.find(x=>x.name===n);if(c)mode==='character'?render(c):renderImage(c,c.name===target.name)});count.textContent=guesses.length;finish(guesses.includes(target.name));return}imageClue.hidden=mode!=='image';title.hidden=mode==='image';if(mode==='image')imageClue.src=target.image}
function setMode(m){mode=m;$('#characterMode').classList.toggle('active',m==='character');$('#imageMode').classList.toggle('active',m==='image');$('#modeNote').textContent=`${play==='daily'?'Daily':'Freeplay'} ${m} target`;start()}function submit(){if(over)return;let c=data.find(x=>norm(x.name)===norm(input.value));if(!c){message.textContent='Choose a character from the suggestions.';return}if(guesses.includes(c.name)){message.textContent='That character has already been guessed.';return}guesses.push(c.name);count.textContent=guesses.length;mode==='character'?render(c):renderImage(c,c.name===target.name);input.value='';suggestions.hidden=true;save();if(c.name===target.name)finish(true)}
$('#characterMode').onclick=()=>setMode('character');$('#imageMode').onclick=()=>setMode('image');$('#dailyMode').onclick=()=>{play='daily';start()};$('#freeplayMode').onclick=()=>{play='freeplay';start()};$('#guessBtn').onclick=submit;$('#giveUp').onclick=()=>finish(false);$('#newGame').onclick=start;$('#successContinue').onclick=()=>setMode(mode==='character'?'image':'character');input.oninput=renderSuggestions;input.onkeydown=e=>{if(e.key==='Enter')submit()};start();
</script></body></html>
